spring:
  application:
    name: iitsm
  config:
    # Local secrets such as ASSISTANT_API_KEY, from the Git-ignored .env file in the project root
    # (or in backend/). Real environment variables still win over these.
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:iitsm}
    username: ${POSTGRES_USER:iitsm}
    password: ${POSTGRES_PASSWORD:iitsm}
  data:
    web:
      pageable:
        max-page-size: 100        # a list never returns more than 100 rows per page, whatever size is asked for
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only verifies it
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 20000   # milliseconds: a mail server that does not answer must never hang the app
      mail.smtp.timeout: 20000
      mail.smtp.writetimeout: 20000

server:
  port: 8080

iitsm:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    jwt-expiration-minutes: 60
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  mail:
    from: noreply@iitsm.local
  sla:
    time-scale: 1.0               # >1 compresses time for demos (10 = 10x faster)
    warning-threshold: 0.8
    monitor-interval-ms: 30000
  escalation:
    level-timeout-minutes: 5
  assistant:                      # the AI guide; off until ASSISTANT_BASE_URL and ASSISTANT_MODEL are set
    base-url: ${ASSISTANT_BASE_URL:}
    api-key: ${ASSISTANT_API_KEY:}
    model: ${ASSISTANT_MODEL:}
    max-tokens: 2000              # room for reasoning models, which spend tokens thinking before they answer
    timeout-seconds: 30
    max-turns: 12

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false   # /actuator/health must not wait for the mail server (it made the health check very slow)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
