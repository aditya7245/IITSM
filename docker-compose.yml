services:
  postgres:
    image: postgres:16-alpine
    container_name: iitsm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iitsm}
      POSTGRES_USER: ${POSTGRES_USER:-iitsm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iitsm}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iitsm} -d ${POSTGRES_DB:-iitsm}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: iitsm-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  pgdata:
